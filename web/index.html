<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CS2 Inspect Screenshot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, "Segoe UI", sans-serif;
      background: #0e1116; color: #e6e6e6; height: 100vh;
      display: flex; flex-direction: column;
    }
    header {
      padding: 12px 16px; border-bottom: 1px solid #222; display: flex;
      gap: 10px; align-items: center; flex-wrap: wrap;
    }
    header h1 { font-size: 15px; font-weight: 600; margin-right: 8px; color: #cdd; }
    #link {
      flex: 1; min-width: 280px; background: #161b22; color: #e6e6e6;
      border: 1px solid #30363d; border-radius: 6px; padding: 8px 10px; font-size: 13px;
    }
    button {
      background: #2563eb; color: #fff; border: 0; border-radius: 6px;
      padding: 8px 16px; font-size: 13px; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button.ghost { background: #21262d; border: 1px solid #30363d; }
    button.ghost:hover { background: #30363d; }
    button:disabled { opacity: .5; cursor: default; }
    main { flex: 1; position: relative; min-height: 0; }
    #canvas-wrap { position: absolute; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    #info {
      position: absolute; left: 14px; bottom: 14px; background: rgba(0,0,0,.6);
      border-radius: 8px; padding: 10px 14px; font-size: 13px; line-height: 1.5;
      pointer-events: none; max-width: 360px;
    }
    #info .name { font-weight: 700; font-size: 15px; color: #fff; }
    #info .dim { color: #9aa4b2; }
    #status {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.7); padding: 6px 14px; border-radius: 20px; font-size: 13px;
    }
    #status.err { background: #7f1d1d; }
  </style>
</head>
<body>
  <header>
    <h1>CS2 Inspect → Screenshot</h1>
    <input id="link" placeholder="CS2 inspect linkini yapıştır (steam://...csgo_econ_action_preview ...)" />
    <button id="render-btn">Render</button>
    <button id="demo-btn" class="ghost">Demo (Crane Flight)</button>
    <button id="demo2-btn" class="ghost">Demo (Case Hardened)</button>
    <button id="png-btn" class="ghost" disabled>PNG indir</button>
  </header>
  <main>
    <div id="canvas-wrap"></div>
    <div id="status">Hazır</div>
    <div id="info"></div>
  </main>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./src/main.js?v=b10"></script>
</body>
</html>
